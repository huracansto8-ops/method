<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Resource Hub</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #fafafa; }
        .game-btn { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>Available Modules</h1>
    <!-- Add buttons for your games here -->
   <button class="game-btn" onclick="openSecret()">Launch Game</button>

<script>
function openSecret() {
    var win = window.open();
    var iframe = win.document.createElement('iframe');
    iframe.style.width = "100vw";
    iframe.style.height = "100vh";
    iframe.style.border = "none";
    
    // Replace the text inside the quotes below with a fresh, unblocked source link
    var targetUrl = "https://gx-launcher.github.io/"; 
    
    // This encodes the URL structure into a blob object so filters can't trace the source domain
    var htmlContent = `<html><body style='margin:0'><iframe src='${targetUrl}' style='width:100vw;height:100vh;border:none;'></iframe></body></html>`;
    var blob = new Blob([htmlContent], {type: 'text/html'});
    
    iframe.src = URL.createObjectURL(blob);
    win.document.body.appendChild(iframe);
}
</script>

</body>
</html>
